workflows:
  release_firebase:
    name: Release to Firebase (release_Sofiia)
    instance_type: mac_mini_m2
    max_build_duration: 60

    # Build ONLY on push to the branch release_Sofiia
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: "release_Sofiia"
          include: true
          source: true

    environment:
      ruby: default
      groups:
        # Create this variable group in Codemagic UI with:
        #   FIREBASE_TOKEN  (from `firebase login:ci`)  -> mark as Secure
        - firebase
      ios_signing:
        # Reference names of the signing files uploaded to Codemagic
        # (Code signing identities). Must match exactly.
        provisioning_profiles:
          - Apple_ENV_Sydorenko
        certificates:
          - ios_development

    scripts:
      - name: Install dependencies (fastlane + plugins)
        script: |
          bundle install

      - name: Apply provisioning profiles
        script: |
          xcode-project use-profiles

      - name: Build & distribute to Firebase App Distribution
        script: |
          bundle exec fastlane ci_release

    artifacts:
      - output/*.ipa
      - output/*.dSYM.zip
